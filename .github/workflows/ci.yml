name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  verify :
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Use Node.js 20.x
        uses: actions/setup-node@v7
        with:
          node-version: 20.x
      - name: Install dependencies and run verification
        run: npm ci
      - name: Run verification
        run: npm run verify